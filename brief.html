<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brief - isieve</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <a href="index.html">&larr; Πίσω στη βιβλιοθήκη</a>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <div id="briefContainer">
            <div class="loading">Φόρτωση brief...</div>
        </div>
    </div>

    <!-- Image Lightbox -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="">
            <div class="lightbox-info">
                <div id="lightboxCaption"></div>
                <div class="lightbox-nav">
                    <button id="lightboxPrev" class="btn btn-secondary">&larr; Προηγούμενη</button>
                    <span id="lightboxCounter"></span>
                    <button id="lightboxNext" class="btn btn-secondary">Επόμενη &rarr;</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/brief.js"></script>
</body>
</html>
