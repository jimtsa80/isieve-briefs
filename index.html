<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briefs Library - isieve</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <h1>isieve Briefs</h1>
            </div>
            <div class="navbar-menu">
                <a href="upload.html" class="btn btn-primary">+ New Brief</a>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <div id="libraryNotice" class="notice-banner edit-status success" style="display: none;"></div>

        <div class="filters-section">
            <div class="search-box">
                <input type="search" id="globalSearch" placeholder="Search all briefs (brand, location, event, client)...">
            </div>
            
            <div class="filters">
                <select id="filterSport">
                    <option value="">All sports</option>
                </select>
                
                <select id="filterClient">
                    <option value="">All clients</option>
                </select>
                
                <input type="date" id="filterDateFrom" placeholder="From date">
                <input type="date" id="filterDateTo" placeholder="To date">
                
                <button id="clearFilters" class="btn btn-secondary btn-sm">Clear</button>
            </div>
        </div>

        <div id="briefsContainer" class="briefs-grid">
            <div class="loading">Loading briefs...</div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
