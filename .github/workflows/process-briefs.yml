name: Process Brief Inbox

on:
  push:
    paths:
      - 'briefs-inbox/**'
      - 'briefs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install openpyxl Pillow
      
      - name: Process inbox files
        run: python scripts/process_inbox.py
      
      - name: Rebuild index
        run: python scripts/rebuild_index.py
      
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A briefs briefs-inbox
          git diff --staged --quiet || git commit -m "🤖 Process brief inbox [skip ci]"
          git pull --rebase
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
