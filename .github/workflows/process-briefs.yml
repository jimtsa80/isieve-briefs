name: Process Brief Inbox

on:
  push:
    paths:
      - 'briefs-inbox/**'
  workflow_dispatch:

concurrency:
  group: process-brief-inbox
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install openpyxl Pillow

      - name: Run parser tests
        run: python tests/test_parser.py

      - name: Process inbox files
        run: python scripts/process_inbox.py

      - name: Optimize images in new briefs
        run: |
          for brief_dir in briefs/brief-*/; do
            if [ ! -d "${brief_dir}thumbs" ] || find "$brief_dir" -maxdepth 1 -name "*.png" -o -name "*.PNG" | grep -q .; then
              echo "Optimizing $brief_dir"
              python scripts/optimize_images.py "$brief_dir"
            fi
          done

      - name: Rebuild index
        run: python scripts/rebuild_index.py

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A briefs briefs-inbox
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "🤖 Process brief inbox [skip ci]"
          NEW_BRIEFS=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- briefs | cut -d/ -f1-2 | grep '^briefs/brief-' | sort -u || true)
          DONE_INBOX=$(git diff --name-only --diff-filter=D HEAD~1 HEAD -- briefs-inbox || true)
          echo "New briefs: $NEW_BRIEFS"
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (main moved, e.g. an Edit/Delete from the site). Re-applying on latest main..."
            sleep $((attempt * 3))
            rm -rf /tmp/keep && mkdir -p /tmp/keep
            for d in $NEW_BRIEFS; do cp -r "$d" /tmp/keep/; done
            git fetch --depth 1 origin main
            git reset --hard FETCH_HEAD
            for d in $NEW_BRIEFS; do rm -rf "$d"; cp -r "/tmp/keep/$(basename "$d")" "$d"; done
            for f in $DONE_INBOX; do git rm -q --ignore-unmatch "$f" || true; done
            python scripts/rebuild_index.py
            git add -A briefs briefs-inbox
            if git diff --staged --quiet; then
              echo "Nothing left to commit after re-sync"
              exit 0
            fi
            git commit -m "🤖 Process brief inbox [skip ci]"
          done
          echo "Could not push after 6 attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
